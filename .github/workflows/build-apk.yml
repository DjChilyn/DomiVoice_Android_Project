name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # =========================================================
      # 1. CHECKOUT Y CONFIGURACIÓN BASE
      # =========================================================
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 2. LOCALIZAR PROYECTO
      # =========================================================
      - name: Buscar Proyecto Android
        run: |
          if [ -f "DomiVoice_Android_Project.zip" ]; then
            unzip -q DomiVoice_Android_Project.zip -d proyecto
            PROJECT_DIR=$(find proyecto -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' -quit)
          else
            PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' -quit)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================================================
      # 3. GRADLE WRAPPER Y REPARACIÓN AUTOMÁTICA DE ANDROIDX
      # =========================================================
      - name: Preparar Gradle y AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x ./gradlew
          
          # Inyectamos AndroidX automáticamente para evitar el error
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      # =========================================================
      # 4. LIMPIAR MANIFEST EN TIEMPO REAL
      # =========================================================
      - name: Corregir Manifest
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MANIFEST=$(find . -name "AndroidManifest.xml" | head -n 1)
          sed -i 's/package="com\.domivoice\.app"//g' "$MANIFEST"
          sed -i '/android:icon="@mipmap\/ic_launcher"/d' "$MANIFEST"
          sed -i '/android:roundIcon="@mipmap\/ic_launcher_round"/d' "$MANIFEST"

      # =========================================================
      # 5. INYECTAR LA FIRMA DE PRODUCCIÓN
      # =========================================================
      - name: Decodificar Llave Secreta
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: No se encontró el secreto KEYSTORE_BASE64 en GitHub."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      # =========================================================
      # 6. COMPILAR EL APK RELEASE
      # =========================================================
      - name: Compilar y Firmar APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # =========================================================
      # 7. VERIFICAR FIRMA Y RENOMBRAR
      # =========================================================
      - name: Verificar y Renombrar APK
        run: |
          APK_FILE=$(find ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release -name "*.apk" | grep -v "unaligned" | head -n 1)
          mv "$APK_FILE" DomiVoice-release.apk
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify --verbose --print-certs DomiVoice-release.apk

      # =========================================================
      # 8. SUBIR PARA DESCARGA
      # =========================================================
      - name: Subir APK Definitivo
        uses: actions/upload-artifact@v4
        with:
          name: DomiVoice-Release-APK
          path: DomiVoice-release.apk
