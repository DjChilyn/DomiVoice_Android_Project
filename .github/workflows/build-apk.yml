name: Build Domi Voice APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. EXTRACT PROJECT
      # =========================================================

      - name: Extract Domi Voice project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "EXTRACTING DOMI VOICE PROJECT"
          echo "========================================"

          rm -rf project

          mkdir -p project

          unzip -q DomiVoice_Android_Project.zip -d project

          echo ""
          echo "FILES INSIDE ZIP:"
          echo "----------------------------------------"

          find project -maxdepth 10 -type f | sort

          echo "----------------------------------------"


      # =========================================================
      # 5. FIND GRADLE PROJECT
      # =========================================================

      - name: Find Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"


          PROJECT_DIR=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: settings.gradle.kts or settings.gradle was not found."

            echo ""
            echo "ZIP STRUCTURE:"
            find project -maxdepth 10 -type f | sort

            exit 1

          fi


          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"


          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6. FIND OR CREATE GRADLE WRAPPER
      # =========================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING GRADLE WRAPPER"
          echo "========================================"


          cd "$PROJECT_DIR"


          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper already exists."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper was not found."

            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew

          fi


          echo ""
          echo "Gradle wrapper status:"

          ls -la gradlew

          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # =========================================================
      # 7. FIX ANDROID CONFIGURATION
      # =========================================================

      - name: Fix Android project configuration
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "FIXING ANDROID CONFIGURATION"
          echo "========================================"


          # -----------------------------------------------------
          # FIND MANIFEST
          # -----------------------------------------------------

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/app/src/main/AndroidManifest.xml" \
            -print -quit)


          if [ -z "$MANIFEST" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            exit 1

          fi


          echo ""
          echo "MANIFEST:"
          echo "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE OBSOLETE PACKAGE
          # -----------------------------------------------------

          sed -i \
            's/package="com\.domivoice\.app"//g' \
            "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE MISSING ICON REFERENCES
          # -----------------------------------------------------

          sed -i \
            '/android:icon="@mipmap\/ic_launcher"/d' \
            "$MANIFEST"


          sed -i \
            '/android:roundIcon="@mipmap\/ic_launcher_round"/d' \
            "$MANIFEST"


          # -----------------------------------------------------
          # GRADLE PROPERTIES
          # -----------------------------------------------------

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"


          touch "$GRADLE_PROPERTIES"


          sed -i \
            '/^android\.useAndroidX=/d' \
            "$GRADLE_PROPERTIES"


          sed -i \
            '/^android\.enableJetifier=/d' \
            "$GRADLE_PROPERTIES"


          echo "android.useAndroidX=true" \
            >> "$GRADLE_PROPERTIES"


          echo "android.enableJetifier=true" \
            >> "$GRADLE_PROPERTIES"


          if ! grep -q "^org.gradle.jvmargs=" "$GRADLE_PROPERTIES"; then

            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" \
              >> "$GRADLE_PROPERTIES"

          fi


          if ! grep -q "^kotlin.code.style=" "$GRADLE_PROPERTIES"; then

            echo "kotlin.code.style=official" \
              >> "$GRADLE_PROPERTIES"

          fi


          echo ""
          echo "FINAL GRADLE PROPERTIES:"
          cat "$GRADLE_PROPERTIES"


          echo ""
          echo "FINAL MANIFEST:"
          cat "$MANIFEST"


      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================

      - name: Verify project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "VERIFYING PROJECT"
          echo "========================================"


          echo ""
          echo "Project root:"
          echo "$PROJECT_DIR"


          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 6 -type f | sort


          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then

            echo "ERROR: AndroidManifest.xml missing."

            exit 1

          fi


          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "ERROR: app Gradle build file missing."

            exit 1

          fi


          if [ ! -f "$PROJECT_DIR/gradlew" ]; then

            echo "ERROR: Gradle wrapper could not be created."

            exit 1

          fi


          echo ""
          echo "PROJECT VERIFICATION PASSED."


      # =========================================================
      # 9. BUILD APK
      # =========================================================

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "========================================"
          echo "BUILDING DOMI VOICE APK"
          echo "========================================"


          chmod +x ./gradlew


          ./gradlew clean assembleDebug --stacktrace


      # =========================================================
      # 10. FIND APK
      # =========================================================

      - name: Find generated APK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"


          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print


      # =========================================================
      # 11. UPLOAD APK
      # =========================================================

      - name: Upload Domi Voice APK
        uses: actions/upload-artifact@v4
        with:
          name: DomiVoice-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
