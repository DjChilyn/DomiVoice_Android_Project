name: Build Domi Voice APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # IMPORTANT:
      # Gradle cache is intentionally disabled because the Android
      # project is stored inside a ZIP file.
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'none'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. EXTRACT ANDROID PROJECT
      # =========================================================

      - name: Extract Domi Voice project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "EXTRACTING DOMI VOICE PROJECT"
          echo "========================================"

          ZIP_FILE="DomiVoice_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf project

          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo ""
          echo "ZIP EXTRACTION COMPLETED."

          echo ""
          echo "FILES INSIDE PROJECT:"
          echo "----------------------------------------"

          find project -maxdepth 10 -type f | sort

          echo "----------------------------------------"


      # =========================================================
      # 5. FIND ANDROID GRADLE PROJECT
      # =========================================================

      - name: Find Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          SETTINGS_FILE=$(find project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "Searching for build files..."

            find project \
              -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print

            exit 1

          fi

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6. PREPARE GRADLE
      # =========================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING GRADLE"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "PROJECT CONTENT:"
          find . -maxdepth 4 -type f | sort


          # -----------------------------------------------------
          # EXISTING GRADLE WRAPPER
          # -----------------------------------------------------

          if [ -f "./gradlew" ]; then

            echo ""
            echo "Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo ""
            echo "Gradle wrapper not found."

            echo "Creating Gradle wrapper using system Gradle."

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew

          fi


          echo ""
          echo "GRADLE WRAPPER:"
          ls -la ./gradlew


          echo ""
          echo "GRADLE VERSION:"

          ./gradlew --version


      # =========================================================
      # 7. FIX ANDROID PROJECT CONFIGURATION
      # =========================================================

      - name: Fix Android project configuration
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "FIXING ANDROID CONFIGURATION"
          echo "========================================"


          # -----------------------------------------------------
          # FIND MANIFEST
          # -----------------------------------------------------

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/app/src/main/AndroidManifest.xml" \
            -type f \
            -print -quit)


          if [ -z "$MANIFEST" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            echo ""
            echo "Searching for manifests..."

            find "$PROJECT_DIR" \
              -name "AndroidManifest.xml" \
              -print

            exit 1

          fi


          echo ""
          echo "ANDROID MANIFEST:"
          echo "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE OLD PACKAGE ATTRIBUTE
          # -----------------------------------------------------

          echo ""
          echo "Removing obsolete package attribute..."

          sed -i \
            's/package="com\.domivoice\.app"//g' \
            "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE MISSING LAUNCHER ICON REFERENCES
          # -----------------------------------------------------

          echo ""
          echo "Removing missing launcher icon references..."

          sed -i \
            '/android:icon="@mipmap\/ic_launcher"/d' \
            "$MANIFEST"


          sed -i \
            '/android:roundIcon="@mipmap\/ic_launcher_round"/d' \
            "$MANIFEST"


          # -----------------------------------------------------
          # GRADLE PROPERTIES
          # -----------------------------------------------------

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"


          sed -i \
            '/^android\.useAndroidX=/d' \
            "$GRADLE_PROPERTIES"


          sed -i \
            '/^android\.enableJetifier=/d' \
            "$GRADLE_PROPERTIES"


          sed -i \
            '/^org\.gradle\.jvmargs=/d' \
            "$GRADLE_PROPERTIES"


          sed -i \
            '/^kotlin\.code\.style=/d' \
            "$GRADLE_PROPERTIES"


          echo "android.useAndroidX=true" \
            >> "$GRADLE_PROPERTIES"


          echo "android.enableJetifier=true" \
            >> "$GRADLE_PROPERTIES"


          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" \
            >> "$GRADLE_PROPERTIES"


          echo "kotlin.code.style=official" \
            >> "$GRADLE_PROPERTIES"


          echo ""
          echo "FINAL GRADLE PROPERTIES:"
          echo "----------------------------------------"

          cat "$GRADLE_PROPERTIES"

          echo "----------------------------------------"


          echo ""
          echo "FINAL ANDROID MANIFEST:"
          echo "----------------------------------------"

          cat "$MANIFEST"

          echo "----------------------------------------"


      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"


          # -----------------------------------------------------
          # CHECK GRADLE
          # -----------------------------------------------------

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then

            echo "ERROR: gradlew was not found."

            exit 1

          fi


          # -----------------------------------------------------
          # CHECK SETTINGS
          # -----------------------------------------------------

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then

            echo "ERROR: settings.gradle or settings.gradle.kts was not found."

            exit 1

          fi


          # -----------------------------------------------------
          # CHECK APP MODULE
          # -----------------------------------------------------

          if [ ! -d "$PROJECT_DIR/app" ]; then

            echo "ERROR: app module was not found."

            exit 1

          fi


          # -----------------------------------------------------
          # CHECK MANIFEST
          # -----------------------------------------------------

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            exit 1

          fi


          # -----------------------------------------------------
          # CHECK BUILD FILE
          # -----------------------------------------------------

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "ERROR: app Gradle build file was not found."

            exit 1

          fi


          echo ""
          echo "PROJECT VERIFICATION PASSED."


      # =========================================================
      # 9. BUILD DEBUG APK
      # =========================================================

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "========================================"
          echo "BUILDING DOMI VOICE APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew clean assembleDebug --stacktrace


      # =========================================================
      # 10. FIND APK
      # =========================================================

      - name: Find generated APK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "========================================"

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)


          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "BUILD OUTPUT:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # =========================================================
      # 11. UPLOAD APK
      # =========================================================

      - name: Upload Domi Voice APK
        uses: actions/upload-artifact@v4
        with:
          name: DomiVoice-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
