name: Build Domi Voice APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. EXTRACT ZIP
      # =========================================================

      - name: Extract Domi Voice project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "EXTRACTING DOMI VOICE PROJECT"
          echo "========================================"

          rm -rf project
          mkdir -p project

          unzip -q DomiVoice_Android_Project.zip -d project

          echo ""
          echo "FILES INSIDE ZIP:"
          echo "----------------------------------------"

          find project -maxdepth 12 -type f | sort

          echo "----------------------------------------"


      # =========================================================
      # 5. FIND ANDROID PROJECT
      # =========================================================

      - name: Find Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          PROJECT_DIR=$(
            find project \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit |
            xargs -r dirname
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "ZIP CONTENTS:"
            find project -maxdepth 12 -type f | sort

            exit 1

          fi

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6. PREPARE GRADLE
      # =========================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING GRADLE WRAPPER"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

          else

            echo "Gradle wrapper not found."

            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7

          fi

          chmod +x ./gradlew

          echo ""
          echo "GRADLE WRAPPER:"
          ls -la ./gradlew

          echo ""
          echo "GRADLE VERSION:"
          ./gradlew --version


      # =========================================================
      # 7. FIX ANDROID CONFIGURATION
      # =========================================================

      - name: Fix Android project configuration
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "FIXING ANDROID CONFIGURATION"
          echo "========================================"


          # -----------------------------------------------------
          # FIND MANIFEST
          # -----------------------------------------------------

          MANIFEST=$(
            find "$PROJECT_DIR" \
              -path "*/app/src/main/AndroidManifest.xml" \
              -print \
              -quit
          )

          if [ -z "$MANIFEST" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            exit 1

          fi

          echo ""
          echo "ANDROID MANIFEST:"
          echo "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE OBSOLETE PACKAGE ATTRIBUTE
          # -----------------------------------------------------

          sed -i \
            's/package="com\.domivoice\.app"//g' \
            "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE MISSING ICON REFERENCES
          # -----------------------------------------------------

          sed -i \
            '/android:icon="@mipmap\/ic_launcher"/d' \
            "$MANIFEST"

          sed -i \
            '/android:roundIcon="@mipmap\/ic_launcher_round"/d' \
            "$MANIFEST"


          # -----------------------------------------------------
          # CONFIGURE ANDROIDX
          # -----------------------------------------------------

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          sed -i \
            '/^android\.useAndroidX=/d' \
            "$GRADLE_PROPERTIES"

          sed -i \
            '/^android\.enableJetifier=/d' \
            "$GRADLE_PROPERTIES"

          echo "android.useAndroidX=true" \
            >> "$GRADLE_PROPERTIES"

          echo "android.enableJetifier=true" \
            >> "$GRADLE_PROPERTIES"


          # -----------------------------------------------------
          # GRADLE JVM
          # -----------------------------------------------------

          sed -i \
            '/^org\.gradle\.jvmargs=/d' \
            "$GRADLE_PROPERTIES"

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" \
            >> "$GRADLE_PROPERTIES"


          # -----------------------------------------------------
          # KOTLIN STYLE
          # -----------------------------------------------------

          sed -i \
            '/^kotlin\.code\.style=/d' \
            "$GRADLE_PROPERTIES"

          echo "kotlin.code.style=official" \
            >> "$GRADLE_PROPERTIES"


          echo ""
          echo "FINAL GRADLE PROPERTIES:"
          cat "$GRADLE_PROPERTIES"


          echo ""
          echo "FINAL ANDROID MANIFEST:"
          cat "$MANIFEST"


      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


          if [ ! -f "$PROJECT_DIR/gradlew" ]; then

            echo "ERROR: gradlew was not found."

            exit 1

          fi


          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/app/src/main/AndroidManifest.xml" \
            -print \
            -quit)


          if [ -z "$MANIFEST" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            exit 1

          fi


          APP_GRADLE=$(find "$PROJECT_DIR/app" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print \
            -quit)


          if [ -z "$APP_GRADLE" ]; then

            echo "ERROR: App Gradle build file was not found."

            exit 1

          fi


          echo ""
          echo "GRADLE WRAPPER:"
          ls -lh "$PROJECT_DIR/gradlew"

          echo ""
          echo "MANIFEST:"
          echo "$MANIFEST"

          echo ""
          echo "APP GRADLE FILE:"
          echo "$APP_GRADLE"

          echo ""
          echo "PROJECT VERIFICATION PASSED."


      # =========================================================
      # 9. BUILD APK
      # =========================================================

      - name: Build Domi Voice debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "========================================"
          echo "BUILDING DOMI VOICE APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew clean assembleDebug --stacktrace

          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY."


      # =========================================================
      # 10. FIND APK
      # =========================================================

      - name: Find generated APK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "========================================"

          APK_FILE=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: No APK file was generated."

            echo ""
            echo "BUILD OUTPUT:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 12 \
              -type f \
              | sort

            exit 1

          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 11. PREPARE APK
      # =========================================================

      - name: Prepare APK artifact
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING APK ARTIFACT"
          echo "========================================"

          rm -rf release

          mkdir -p release

          cp "$APK_FILE" \
            "release/DomiVoice-debug.apk"

          echo ""
          echo "APK READY:"

          ls -lh release/DomiVoice-debug.apk


      # =========================================================
      # 12. UPLOAD APK
      # =========================================================

      - name: Upload Domi Voice APK
        uses: actions/upload-artifact@v4
        with:
          name: DomiVoice-debug-APK
          path: release/DomiVoice-debug.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 13. FINAL SUMMARY
      # =========================================================

      - name: Build summary
        shell: bash
        run: |

          echo "========================================"
          echo "DOMI VOICE BUILD SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "APK FILE:"
          ls -lh release/DomiVoice-debug.apk

          echo ""
          echo "ARTIFACT:"
          echo "DomiVoice-debug-APK"

          echo ""
          echo "The APK was successfully uploaded."
