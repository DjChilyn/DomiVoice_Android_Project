name: Build Domi Voice APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. EXTRACT PROJECT ZIP
      # =========================================================

      - name: Extract Domi Voice project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "EXTRACTING DOMI VOICE PROJECT"
          echo "========================================"

          rm -rf project

          mkdir -p project

          unzip -q DomiVoice_Android_Project.zip -d project

          echo ""
          echo "PROJECT FILES:"
          echo "----------------------------------------"

          find project -maxdepth 10 -type f | sort

          echo "----------------------------------------"


      # =========================================================
      # 5. FIND ANDROID PROJECT
      # =========================================================

      - name: Find Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          PROJECT_DIR=$(find project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "ZIP CONTENT:"
            find project -maxdepth 10 -type f | sort

            exit 1

          fi

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6. PREPARE GRADLE WRAPPER
      # =========================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING GRADLE WRAPPER"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

          else

            echo "Gradle wrapper not found."

            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7

          fi

          chmod +x ./gradlew

          echo ""
          echo "GRADLE WRAPPER:"
          ls -la ./gradlew

          echo ""
          echo "GRADLE VERSION:"

          ./gradlew --version


      # =========================================================
      # 7. FIX ANDROID CONFIGURATION
      # =========================================================

      - name: Fix Android project configuration
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "FIXING ANDROID CONFIGURATION"
          echo "========================================"


          # -----------------------------------------------------
          # FIND MANIFEST
          # -----------------------------------------------------

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/app/src/main/AndroidManifest.xml" \
            -print -quit)


          if [ -z "$MANIFEST" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            exit 1

          fi


          echo ""
          echo "ANDROID MANIFEST:"
          echo "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE OBSOLETE PACKAGE ATTRIBUTE
          # -----------------------------------------------------

          sed -i \
            's/package="com\.domivoice\.app"//g' \
            "$MANIFEST"


          # -----------------------------------------------------
          # REMOVE MISSING LAUNCHER ICON REFERENCES
          # -----------------------------------------------------

          sed -i \
            '/android:icon="@mipmap\/ic_launcher"/d' \
            "$MANIFEST"

          sed -i \
            '/android:roundIcon="@mipmap\/ic_launcher_round"/d' \
            "$MANIFEST"


          # -----------------------------------------------------
          # CONFIGURE ANDROIDX
          # -----------------------------------------------------

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          sed -i '/^android\.useAndroidX=/d' \
            "$GRADLE_PROPERTIES"

          sed -i '/^android\.enableJetifier=/d' \
            "$GRADLE_PROPERTIES"

          echo "android.useAndroidX=true" \
            >> "$GRADLE_PROPERTIES"

          echo "android.enableJetifier=true" \
            >> "$GRADLE_PROPERTIES"


          # -----------------------------------------------------
          # GRADLE JVM
          # -----------------------------------------------------

          if ! grep -q "^org.gradle.jvmargs=" \
            "$GRADLE_PROPERTIES"; then

            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" \
              >> "$GRADLE_PROPERTIES"

          fi


          # -----------------------------------------------------
          # KOTLIN CODE STYLE
          # -----------------------------------------------------

          if ! grep -q "^kotlin.code.style=" \
            "$GRADLE_PROPERTIES"; then

            echo "kotlin.code.style=official" \
              >> "$GRADLE_PROPERTIES"

          fi


          echo ""
          echo "FINAL GRADLE PROPERTIES:"
          cat "$GRADLE_PROPERTIES"


          echo ""
          echo "FINAL ANDROID MANIFEST:"
          cat "$MANIFEST"


      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


          if [ ! -f "$PROJECT_DIR/gradlew" ]; then

            echo "ERROR: gradlew was not found."

            exit 1

          fi


          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then

            echo "ERROR: AndroidManifest.xml was not found."

            exit 1

          fi


          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "Found app/build.gradle.kts"

          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "Found app/build.gradle"

          else

            echo "ERROR: app Gradle build file was not found."

            exit 1

          fi


          echo ""
          echo "PROJECT VERIFICATION PASSED."


      # =========================================================
      # 9. BUILD APK
      # =========================================================

      - name: Build Domi Voice debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          set -e

          echo "========================================"
          echo "BUILDING DOMI VOICE APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew clean assembleDebug --stacktrace

          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY."


      # =========================================================
      # 10. FIND APK
      # =========================================================

      - name: Find generated APK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "========================================"

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: APK output directory was not found."

            find "$PROJECT_DIR/app/build" \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1

          fi


          echo ""
          echo "GENERATED APK FILES:"
          echo "----------------------------------------"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          echo "----------------------------------------"


          APK_FILE=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: No APK file was generated."

            exit 1

          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 11. PREPARE APK
      # =========================================================

      - name: Prepare APK artifact
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING APK ARTIFACT"
          echo "========================================"

          rm -rf release

          mkdir -p release

          cp "$APK_FILE" \
            "release/DomiVoice-debug.apk"


          echo ""
          echo "APK READY:"
          ls -lh release/DomiVoice-debug.apk


      # =========================================================
      # 12. UPLOAD APK
      # =========================================================

      - name: Upload Domi Voice APK
        uses: actions/upload-artifact@v4
        with:
          name: DomiVoice-debug-APK
          path: release/DomiVoice-debug.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 13. FINAL SUMMARY
      # =========================================================

      - name: Build summary
        shell: bash
        run: |

          echo "========================================"
          echo "DOMI VOICE BUILD SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "APK FILE:"
          ls -lh release/DomiVoice-debug.apk

          echo ""
          echo "ARTIFACT:"
          echo "DomiVoice-debug-APK"

          echo ""
          echo "APK upload completed successfully."
